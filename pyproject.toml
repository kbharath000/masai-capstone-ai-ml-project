[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml-project"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4",
    "requests",
    "mysql-connector-python",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["support_assistant*", "data_pipeline*", "analytics*"]
